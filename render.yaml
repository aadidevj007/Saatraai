# Render Blueprint for SAATRAAI Platform
# Deploy full-stack Earth Intelligence Platform: FastAPI Backend + PostGIS + Redis
version: "1"

services:
  # ── FASTAPI BACKEND SERVICE ──
  - type: web
    name: saatraai-api
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saatraai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: saatraai-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://saatraai.vercel.app"
      - key: LOCAL_STORAGE_PATH
        value: "./data/uploads"

  # ── REDIS CACHE & BACKGROUND QUEUES ──
  - type: redis
    name: saatraai-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── MANAGED POSTGRESQL + POSTGIS ──
  - name: saatraai-db
    region: oregon
    plan: free
    databaseName: saatraai
    user: saatraai
    postgresMajorVersion: "16"
    ipAllowList: []

