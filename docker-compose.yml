services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: saatraai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saatraai
      POSTGRES_USER: saatraai
      POSTGRES_PASSWORD: saatraai_dev
    ports:
      - "5432:5432"
    volumes:
      - saatraai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saatraai -d saatraai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saatraai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - saatraai_redis_data:/data

volumes:
  saatraai_postgres_data:
  saatraai_redis_data: